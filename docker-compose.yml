services:
  frontend:
    container_name: staycool-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_COUNT: ${GIT_COMMIT_COUNT:-0}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
    restart: always
    ports:
      - "8541:80"
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
